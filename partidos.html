<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partidos LaLiga — Otitanuz Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black:      #000000;
      --deep:       #080b10;
      --panel:      #0d1117;
      --card:       #111620;
      --border:     #1e2a3a;
      --neon:       #007bff;
      --neon-soft:  rgba(0,123,255,0.15);
      --gold:       #ffc800;
      --gold-soft:  rgba(255,200,0,0.12);
      --text:       #e8eaf0;
      --muted:      #c8d0db;
      --dim:        #8a9bb0;
      --font-d:     'Bebas Neue', sans-serif;
      --font-b:     'Lato', sans-serif;
      --radius:     6px;
      --tr:         0.25s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--black); color: var(--text); font-family: var(--font-b); font-weight: 300; }
    a { text-decoration: none; color: inherit; }

    /* ── HEADER ─────────────────────────────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 5%;
      display: flex; align-items: center; justify-content: space-between;
      height: 62px;
    }
    .topbar-logo { font-family: var(--font-d); font-size: 1.5rem; letter-spacing: 0.15em; color: #fff; }
    .topbar-logo span { color: var(--neon); }
    .back-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 0.35rem 1rem;
      transition: color var(--tr), border-color var(--tr);
    }
    .back-btn:hover { color: var(--neon); border-color: var(--neon); }

    /* ── HERO ────────────────────────────────────────────────── */
    .hero {
      position: relative; overflow: hidden;
      background: radial-gradient(ellipse 80% 70% at 70% 50%, rgba(20,16,0,0.95) 0%, #0a0800 60%, #000 100%);
      padding: 4rem 5% 3.5rem;
      border-bottom: 1px solid rgba(255,200,0,0.12);
    }
    .hero-bg-num {
      position: absolute; right: -1%; top: 50%; transform: translateY(-50%);
      font-family: var(--font-d); font-size: clamp(140px,20vw,300px);
      color: rgba(255,200,0,0.04); line-height: 1;
      pointer-events: none; user-select: none;
    }
    .hero-inner {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: space-between; gap: 2rem;
      max-width: 1200px; margin: 0 auto;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--gold-soft); border: 1px solid rgba(255,200,0,0.35);
      border-radius: 30px; padding: 0.3rem 1rem; margin-bottom: 1.2rem;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.25em;
      text-transform: uppercase; color: var(--gold);
    }
    .hero-title {
      font-family: var(--font-d);
      font-size: clamp(2.4rem, 6vw, 4.8rem);
      line-height: 0.95; letter-spacing: 0.04em; margin-bottom: 0.8rem;
    }
    .hero-title .w { color: #fff; display: block; }
    .hero-title .g { color: var(--gold); display: block; }
    .hero-title .b { color: var(--neon); display: block; }
    .hero-meta {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.2em;
      color: var(--muted); text-transform: uppercase; margin-bottom: 1rem;
    }
    .hero-desc { font-size: 0.88rem; color: #c8d0db; line-height: 1.8; max-width: 480px; }

    /* Trofeo */
    .trophy-wrap {
      position: relative; width: 180px; height: 180px; flex-shrink: 0;
    }
    .trophy-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid rgba(255,200,0,0.2);
      box-shadow: 0 0 30px rgba(255,200,0,0.07);
    }
    .trophy-star {
      position: absolute; color: var(--gold); font-size: 0.7rem; opacity: 0.6;
    }

    /* ── CONTROLES ───────────────────────────────────────────── */
    .controls {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 5%;
      position: sticky; top: 62px; z-index: 90;
    }
    .controls-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    .controls-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted); white-space: nowrap;
    }
    .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .f-btn {
      padding: 0.3rem 0.85rem;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; background: transparent;
      color: var(--muted); border: 1px solid var(--border);
      border-radius: 20px; cursor: pointer;
      transition: all var(--tr);
    }
    .f-btn:hover { color: var(--neon); border-color: var(--neon); background: var(--neon-soft); }
    .f-btn.active { color: var(--neon); border-color: var(--neon); background: var(--neon-soft); }
    .f-btn.gold { color: var(--gold); border-color: rgba(255,200,0,0.4); }
    .f-btn.gold:hover, .f-btn.gold.active { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }

    /* Contador de resultados */
    #match-count {
      margin-left: auto; font-size: 0.72rem; color: var(--muted);
      white-space: nowrap;
    }
    #match-count span { color: var(--neon); font-weight: 700; }

    /* ── GRID DE PARTIDOS ────────────────────────────────────── */
    .matches-section {
      max-width: 1200px; margin: 0 auto;
      padding: 2.5rem 5% 5rem;
    }

    /* Separador de grupo */
    .group-header {
      display: flex; align-items: center; gap: 1rem;
      margin: 2.5rem 0 1.2rem;
    }
    .group-header:first-child { margin-top: 0; }
    .group-title {
      font-family: var(--font-d); font-size: 1.4rem;
      letter-spacing: 0.1em; color: var(--text);
      white-space: nowrap;
    }
    .group-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, var(--border), transparent);
    }
    .group-count {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--dim);
    }

    /* Grid */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.85rem;
    }

    /* Tarjeta */
    .mc {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      display: flex; flex-direction: column; gap: 0.5rem;
      transition: border-color var(--tr), transform var(--tr), box-shadow var(--tr);
      cursor: default;
    }
    .mc:hover {
      border-color: rgba(0,123,255,0.4);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    .mc.spain {
      border-color: rgba(255,200,0,0.28);
      background: linear-gradient(135deg, var(--card) 55%, rgba(255,200,0,0.03) 100%);
    }
    .mc.spain:hover {
      border-color: rgba(255,200,0,0.6);
      box-shadow: 0 6px 22px rgba(255,200,0,0.1);
    }
    .mc.final-card {
      border-color: rgba(255,200,0,0.4);
      background: linear-gradient(135deg, var(--card) 40%, rgba(255,200,0,0.06) 100%);
    }
    .mc.hidden { display: none; }

    /* Badge */
    .mc-badge {
      display: inline-block; align-self: flex-start;
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; padding: 0.18rem 0.55rem;
      border-radius: 20px; border: 1px solid rgba(0,123,255,0.3);
      color: var(--neon); background: var(--neon-soft);
    }
    .mc-badge.gold { color: var(--gold); background: var(--gold-soft); border-color: rgba(255,200,0,0.35); }
    .mc-badge.orange { color: #ffa000; background: rgba(255,160,0,0.12); border-color: rgba(255,160,0,0.35); }

    /* Fecha */
    .mc-date {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      color: var(--text);
    }

    /* Equipos */
    .mc-teams {
      display: flex; align-items: center; gap: 0.4rem;
    }
    .mc-team {
      font-size: 0.86rem; color: var(--muted); flex: 1; line-height: 1.3;
    }
    .mc-team.bold { color: #fff; font-weight: 700; }
    .mc-team.right { text-align: right; }
    .mc-vs {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
      color: var(--dim); background: var(--border);
      padding: 0.12rem 0.35rem; border-radius: 3px; flex-shrink: 0;
    }

    /* Sede */
    .mc-venue {
      font-size: 0.68rem; color: var(--dim);
      border-top: 1px solid var(--border); padding-top: 0.45rem;
    }

    /* ── RESPONSIVE ──────────────────────────────────────────── */
    @media (max-width: 600px) {
      .hero-inner { flex-direction: column; }
      .trophy-wrap { display: none; }
      .controls-inner { flex-direction: column; align-items: flex-start; }
      #match-count { margin-left: 0; }
    }
  </style>
</head>
<body>

  <!-- ── TOPBAR ─────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-logo">OTITANUZ <span>BAR</span></div>
    <a href="otitanuz-bar.html" class="back-btn">← Volver al inicio</a>
  </header>


  <!-- ── HERO ──────────────────────────────────────────────── -->
  <section class="hero">
    <div class="hero-bg-num">⚽</div>
    <div class="hero-inner">
      <div>
        <div class="hero-badge">⚽ LaLiga EA Sports 2026-27</div>
        <h1 class="hero-title">
          <span class="w">CALENDARIO</span>
          <span class="g">LALIGA</span>
          <span class="b">2026-27</span>
        </h1>
        <p class="hero-meta">⚽ BARÇA &nbsp;·&nbsp; REAL MADRID &nbsp;·&nbsp; ATLÉTICO &nbsp;·&nbsp; TODA LALIGA</p>
        <p class="hero-desc">Todos los partidos en hora de España peninsular. Vívelos en OTITANUZ BAR, en el corazón de Barcelona.</p>
      </div>
      <!-- Balón -->
      <div class="trophy-wrap">
        <div class="trophy-ring"></div>
        <div class="trophy-star" style="top:14px;left:24px;">★</div>
        <div class="trophy-star" style="top:14px;right:24px;">★</div>
        <div class="trophy-star" style="bottom:24px;left:14px;opacity:.5;">★</div>
        <div class="trophy-star" style="bottom:24px;right:14px;opacity:.5;">★</div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;">⚽</div>
      </div>
    </div>
  </section>

  <!-- ── CONTROLES / FILTROS ───────────────────────────────── -->
  <div class="controls">
    <div class="controls-inner">
      <span class="controls-label">Filtrar:</span>
      <div class="filters" id="filters"></div>
      <span id="match-count"><span id="cnt">—</span> partidos</span>
    </div>
  </div>

  <!-- ── PARTIDOS (generados por JS) ─────────────────────────── -->
  <main class="matches-section" id="matches-main"></main>

  <script>
  /* ════════════════════════════════════════════════════════════
     ✏️  EDITA AQUÍ LOS PARTIDOS DE LALIGA
     Cada partido: { date:'YYYY-MM-DD', time:'HH:MM', home, away,
                     jornada:11, venue, barca:true (solo el del Barça) }
     Para añadir otra jornada, copia un bloque y cambia los datos.
     ════════════════════════════════════════════════════════════ */
  var PARTIDOS = [
    // ── JORNADA 11 ──
    {date:'2026-10-30',time:'21:00',home:'Villarreal',away:'Espanyol',jornada:11,venue:'Estadio de la Cerámica'},
    {date:'2026-10-31',time:'14:00',home:'Levante',away:'Atlético de Madrid',jornada:11,venue:'Ciutat de València'},
    {date:'2026-10-31',time:'16:15',home:'Rayo Vallecano',away:'Celta',jornada:11,venue:'Vallecas'},
    {date:'2026-10-31',time:'18:30',home:'Real Betis',away:'Málaga',jornada:11,venue:'Benito Villamarín'},
    {date:'2026-10-31',time:'21:00',home:'🔵🔴 Barcelona',away:'Alavés',jornada:11,venue:'Estadi Olímpic Lluís Companys',barca:true},
    {date:'2026-11-01',time:'14:00',home:'Getafe',away:'Sevilla',jornada:11,venue:'Coliseum'},
    {date:'2026-11-01',time:'16:15',home:'Racing de Santander',away:'Real Madrid',jornada:11,venue:'El Sardinero'},
    {date:'2026-11-01',time:'18:30',home:'Elche',away:'Valencia',jornada:11,venue:'Martínez Valero'},
    {date:'2026-11-01',time:'21:00',home:'Athletic Club',away:'Real Sociedad',jornada:11,venue:'San Mamés'},
    {date:'2026-11-02',time:'21:00',home:'Deportivo',away:'Osasuna',jornada:11,venue:'Riazor'},
  ];
  /* ════════════════════════════════════════════════════════════
     FIN ZONA DE EDICIÓN — no toques nada debajo
     ════════════════════════════════════════════════════════════ */

  (function() {
    var MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    var DIAS  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

    function fmtFecha(dateStr) {
      var p = dateStr.split('-');
      var d = new Date(+p[0], +p[1]-1, +p[2]);
      return DIAS[d.getDay()] + ' ' + (+p[2]) + ' ' + MESES[+p[1]-1];
    }

    // Jornadas únicas en orden
    var jornadas = [];
    PARTIDOS.forEach(function(p){ if(jornadas.indexOf(p.jornada)<0) jornadas.push(p.jornada); });

    // ── Filtros ──
    var filtersEl = document.getElementById('filters');
    var fHtml = '<button class="f-btn active" data-filter="all">Todos</button>';
    fHtml += '<button class="f-btn gold" data-filter="barca">🔵🔴 Barça</button>';
    jornadas.forEach(function(j){
      fHtml += '<button class="f-btn" data-filter="J'+j+'">Jornada '+j+'</button>';
    });
    filtersEl.innerHTML = fHtml;

    // ── Tarjetas agrupadas por jornada ──
    var mainEl = document.getElementById('matches-main');
    var html = '';
    jornadas.forEach(function(j){
      var partidosJ = PARTIDOS.filter(function(p){ return p.jornada===j; });
      html += '<div class="group-header" data-gh="J'+j+'">';
      html += '<span class="group-title">Jornada '+j+'</span>';
      html += '<div class="group-line"></div>';
      html += '<span class="group-count">'+partidosJ.length+' partidos</span>';
      html += '</div>';
      html += '<div class="matches-grid">';
      partidosJ.forEach(function(p){
        var barca = p.barca || false;
        html += '<div class="mc'+(barca?' spain':'')+'" data-group="J'+j+'"'+(barca?' data-spain="1"':'')+'>';
        html += '<span class="mc-badge'+(barca?' gold':'')+'">⚽ Jornada '+j+'</span>';
        html += '<div class="mc-date">'+fmtFecha(p.date)+' · '+p.time+'h</div>';
        html += '<div class="mc-teams">';
        html += '<span class="mc-team'+(barca?' bold':'')+'">'+p.home+'</span>';
        html += '<span class="mc-vs">VS</span>';
        html += '<span class="mc-team right">'+p.away+'</span>';
        html += '</div>';
        html += '<div class="mc-venue">📍 '+p.venue+'</div>';
        html += '</div>';
      });
      html += '</div>';
    });

    // CTA final
    html += '<div style="margin-top:4rem;text-align:center;padding:3rem;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);">';
    html += '<p style="font-size:0.72rem;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;color:var(--neon);margin-bottom:0.6rem;">OTITANUZ BAR · BARCELONA</p>';
    html += '<h3 style="font-family:var(--font-d);font-size:2.2rem;letter-spacing:0.08em;color:#fff;margin-bottom:0.8rem;">RESERVA TU MESA PARA EL PARTIDO</h3>';
    html += '<p style="font-size:0.88rem;color:var(--muted);margin-bottom:2rem;">No te quedes sin sitio en los grandes duelos. Escríbenos o llámanos.</p>';
    html += '<a href="otitanuz-bar.html#visita" style="display:inline-block;padding:0.9rem 2.5rem;background:var(--neon);color:#fff;font-family:var(--font-b);font-size:0.8rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;border:2px solid var(--neon);border-radius:6px;">RESERVAR MESA →</a>';
    html += '</div>';

    mainEl.innerHTML = html;

    // ── Lógica de filtros ──
    var allCards   = document.querySelectorAll('.mc');
    var allHeaders = document.querySelectorAll('.group-header');
    var countEl    = document.getElementById('cnt');

    function updateCount(){
      countEl.textContent = document.querySelectorAll('.mc:not(.hidden)').length;
    }

    document.querySelectorAll('.f-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.querySelectorAll('.f-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        var filter = btn.dataset.filter;
        allCards.forEach(function(card){
          if (filter==='all') card.classList.remove('hidden');
          else if (filter==='barca') card.classList.toggle('hidden', !card.dataset.spain);
          else card.classList.toggle('hidden', card.dataset.group !== filter);
        });
        allHeaders.forEach(function(gh){
          var sib = gh.nextElementSibling;
          if(!sib) return;
          var vis = sib.querySelectorAll('.mc:not(.hidden)').length;
          gh.style.display = vis===0 ? 'none':'flex';
          sib.style.display = vis===0 ? 'none':'grid';
        });
        updateCount();
      });
    });

    updateCount();
  })();
  </script>

</body>
</html>
